name: CI/CD Pipeline

on:
  push:
    branches:
      - main

permissions:
  id-token: write
  contents: read

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Inspect GitHub OIDC claims
        uses: github/actions-oidc-debugger@v1
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::480111644340:role/GitHubActionsECRRole
          aws-region: us-east-2

      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build Docker image
        run: docker build -t kubernetes-cicd-app:v1 .

      - name: Tag Docker image
        run: |
          docker tag kubernetes-cicd-app:v1 \
            480111644340.dkr.ecr.us-east-2.amazonaws.com/kubernetes-cicd-app:v1

      - name: Push Docker image
        run: |
          docker push \
            480111644340.dkr.ecr.us-east-2.amazonaws.com/kubernetes-cicd-app:v1
